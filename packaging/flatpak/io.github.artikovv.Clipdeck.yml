# Flathub manifest. Build locally with:
#   flatpak-builder --user --install --force-clean build-dir packaging/flatpak/io.github.artikovv.Clipdeck.yml
app-id: io.github.artikovv.Clipdeck
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
# PySide6 built against the runtime's Qt; never pip-install PySide6 here.
base: io.qt.PySide.BaseApp
base-version: '6.10'
command: clipdeck
build-options:
  env:
    - BASEAPP_REMOVE_WEBENGINE=1
    - BASEAPP_DISABLE_NUMPY=1
cleanup-commands:
  - /app/cleanup-BaseApp.sh
finish-args:
  # Clipdeck reads the clipboard and pastes through X11.
  - --socket=x11
  - --share=ipc
  # Sync with other computers on the local network.
  - --share=network
  # Tray icon and notifications.
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications
modules:
  - name: xdotool
    no-autogen: true
    make-install-args:
      - PREFIX=/app
      - INSTALLMAN=/app/share/man
    sources:
      - type: archive
        url: https://github.com/jordansissel/xdotool/releases/download/v3.20211022.1/xdotool-3.20211022.1.tar.gz
        sha256: 96f0facfde6d78eacad35b91b0f46fecd0b35e474c03e00e30da3fdd345f9ada
    cleanup:
      - /include
      - /share/man

  - name: python3-cryptography
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --no-deps --prefix=/app --find-links=. cryptography cffi pycparser
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/1a/f1/b474e930c4d910328780e3940da76f5aa5cbc48ce1fc14e44d239d9ea9db/cryptography-50.0.2-cp311-abi3-manylinux_2_28_x86_64.whl
        sha256: 4061c0079120205fb760c58acab6443e217307dcf05e3702cf970e0689972856
        only-arches: [x86_64]
      - type: file
        url: https://files.pythonhosted.org/packages/38/6b/61a3f8d8c5e1e49a6cddccafc4015cc1c0021360ab0acb4080e7a423644a/cryptography-50.0.2-cp311-abi3-manylinux_2_28_aarch64.whl
        sha256: f9f6143a8c75945eb960d9eb98905a441394abfa24afaae239d514ffb2586480
        only-arches: [aarch64]
      - type: file
        url: https://files.pythonhosted.org/packages/95/95/86342356ff5953b3fb06f7ef7c5bee212d45e770abc7218d451b9148313c/cffi-2.1.1-cp313-cp313-manylinux2014_x86_64.manylinux_2_17_x86_64.whl
        sha256: a931079504ecc49efed7744c476a5c343a92fabf66dec2db95edb1b2fdc770e2
        only-arches: [x86_64]
      - type: file
        url: https://files.pythonhosted.org/packages/37/6f/3b5ce4c3b2192d250f04908f2bfd91ef34552ec8f7716a5d4abdb8d67bb2/cffi-2.1.1-cp313-cp313-manylinux2014_aarch64.manylinux_2_17_aarch64.whl
        sha256: f16c709686a78c727bbbf059f92b0bf41c6fc60deec706d2dc19f529175a6125
        only-arches: [aarch64]
      - type: file
        url: https://files.pythonhosted.org/packages/b6/ae/315bbeee126a769cbde43cf4908acb4b40408d8bf8bbf334dd7368d8dadf/pycparser-3.12-py3-none-any.whl
        sha256: a076f3f489b39b43ed13563a1dafe42447445bec2e294154ec5c57fcdda4c85e

  - name: clipdeck
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --no-deps --no-build-isolation --prefix=/app .
      - install -Dm644 data/io.github.artikovv.Clipdeck.desktop /app/share/applications/io.github.artikovv.Clipdeck.desktop
      - install -Dm644 data/io.github.artikovv.Clipdeck.svg /app/share/icons/hicolor/scalable/apps/io.github.artikovv.Clipdeck.svg
      - install -Dm644 data/io.github.artikovv.Clipdeck.metainfo.xml /app/share/metainfo/io.github.artikovv.Clipdeck.metainfo.xml
    sources:
      # For the Flathub submission, replace this with the release tarball:
      #   - type: archive
      #     url: https://github.com/artikovv/clipdeck/archive/refs/tags/v0.2.0.tar.gz
      #     sha256: <printed by scripts/release-hashes.sh>
      - type: dir
        path: ../..
